; ===========================================================================
;  Sized for 16 GB host RAM (MacBook Air M5), Docker Desktop with 6-8 GB.
;  For production: lower memory_limit, set opcache.validate_timestamps=0.
; ===========================================================================
memory_limit = 2048M
max_execution_time = 180
upload_max_filesize = 64M
post_max_size = 64M
max_input_vars = 5000
date.timezone = Europe/Berlin

; Sulu/Sylius have very large autoload trees
realpath_cache_size = 8192K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 40000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

apc.enable_cli = 1
zend.assertions = -1

; Image processing for the product images
gd.jpeg_ignore_warning = 1
