# ===========================================================================
#  config/packages/dach_demo.yaml
#  DACH base data for the demo shop
#
#  VERIFIED AGAINST: Sylius 2.2.8, Symfony 7.4.16, PHP 8.3.33
#
#  IMPORTANT - why this file is NOT called "_sylius.yaml":
#  Sylius 2.x ships its own config/packages/_sylius.yaml, which contains
#  the workflow definitions among other things. A custom file with the
#  same name overwrites it and the kernel stops booting
#  ("Invalid configuration for path framework.workflows.workflows.sylius_payment").
#
#  Load order inside config/packages/ is alphabetical:
#      _sylius.yaml                    <- Sylius core (workflows, state machines)
#      dach_demo.yaml                  <- this file
#      dach_products.yaml              <- products (optional)
#      sylius_shipping_payment.yaml    <- shipping + payment
#  "_" < "d" < "s" - correct order.
#
#  OTHER REMOVED BLOCKS (no longer valid in Sylius 2.2):
#    sylius_locale:   locale: ...    -> doesn't exist anymore, the channel sets this
#    sylius_currency: currency: ...  -> "Unrecognized option", only
#                                       driver/resources allowed now
#    sylius_order:    expiration:    -> key unverified, left out for that
#                                       reason. Revisit for production, see
#                                       CLAUDE.md section 8 (GDPR).
#
#  NO services BLOCK HERE!
#  config/services.yaml loads AFTER config/packages/ and would override any
#  service definition placed here. The fixture definition is therefore
#  appended to the end of config/services.yaml (done by install-apps.sh).
# ===========================================================================

framework:
    default_locale: de_DE
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['de', 'en']

    # --------------------------------------------------------------------
    #  Subpath operation behind the router (/shop/)
    #  Without 'x-forwarded-prefix', Sylius generates links to /checkout/...
    #  instead of /shop/checkout/... - checkout then leads nowhere.
    # --------------------------------------------------------------------
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers:
        - 'x-forwarded-for'
        - 'x-forwarded-host'
        - 'x-forwarded-proto'
        - 'x-forwarded-port'
        - 'x-forwarded-prefix'

# ===========================================================================
#  MAIL SENDER (see FIXES.md No. 34)
#  Sylius' own default (config/app/sylius/sylius_mailer.yml, vendor code -
#  not ours to edit) ships "Example.com" / "no-reply@example.com". This
#  overrides just the sender - the same override-instead-of-vendor-edit
#  approach used throughout this project (see README.md, "vendor code vs.
#  custom code").
# ===========================================================================
sylius_mailer:
    sender:
        name: 'Rockband Demo Shop'
        address: 'noreply@rockband-demo.de'

# ===========================================================================
#  CHECKOUT STATE MACHINE
#
#  cart -> addressed -> shipping_selected -> payment_selected -> completed
#
#  This is Sylius' standard graph. It is DELIBERATELY NOT overridden here:
#  a custom graph disables the built-in callbacks (shipment/payment
#  creation, stock deduction, confirmation email) and is the most common
#  cause of a broken checkout in Sylius projects.
#
#  Sylius 2.x uses Symfony Workflow, configured in the framework's own
#  _sylius.yaml. Inspect it with:
#      bin/console workflow:dump sylius_order_checkout
# ===========================================================================

# ===========================================================================
#  GUEST CHECKOUT
#  config/packages/security.yaml MUST contain, under access_control:
#      - { path: "%sylius.security.shop_regex%/checkout", role: PUBLIC_ACCESS }
#  If that says ROLE_USER instead, the guest is forced into registration.
#  "make verify" checks this.
# ===========================================================================

# ===========================================================================
#  FIXTURE SUITE "dach_demo" - part 1: base data
#  Part 2: sylius_shipping_payment.yaml (shipping, payment)
#  Part 3: dach_products.yaml (products, optional)
#
#  If an unknown option key gets reported while loading:
#      bin/console config:dump-reference sylius_fixtures
#  "make verify" saves this output under var/reference/.
# ===========================================================================
sylius_fixtures:
    suites:
        dach_demo:
            listeners:
                orm_purger: ~
                logger: ~

            fixtures:

                locale:
                    options:
                        locales: ['de_DE', 'de_AT', 'de_CH']

                currency:
                    options:
                        currencies: ['EUR', 'CHF']

                geographical:
                    options:
                        countries: ['DE', 'AT', 'CH']
                        zones:
                            DE:
                                name: 'Deutschland'
                                countries: ['DE']
                            AT:
                                name: 'Oesterreich'
                                countries: ['AT']
                            CH:
                                name: 'Schweiz'
                                countries: ['CH']
                            DACH:
                                name: 'DACH-Region'
                                countries: ['DE', 'AT', 'CH']

                tax_category:
                    options:
                        custom:
                            - { code: 'standard', name: 'Standardsatz' }
                            - { code: 'reduced',  name: 'Ermaessigter Satz' }

                # VAT: DE 19/7, AT 20/10, CH 8.1/2.6
                # included_in_price: true = gross prices (PAngV, mandatory for B2C)
                tax_rate:
                    options:
                        custom:
                            - { code: 'de_standard', name: 'DE MwSt 19%',  zone: 'DE', category: 'standard', amount: 0.19,  included_in_price: true, calculator: 'default' }
                            - { code: 'de_reduced',  name: 'DE MwSt 7%',   zone: 'DE', category: 'reduced',  amount: 0.07,  included_in_price: true, calculator: 'default' }
                            - { code: 'at_standard', name: 'AT USt 20%',   zone: 'AT', category: 'standard', amount: 0.20,  included_in_price: true, calculator: 'default' }
                            - { code: 'at_reduced',  name: 'AT USt 10%',   zone: 'AT', category: 'reduced',  amount: 0.10,  included_in_price: true, calculator: 'default' }
                            - { code: 'ch_standard', name: 'CH MWST 8.1%', zone: 'CH', category: 'standard', amount: 0.081, included_in_price: true, calculator: 'default' }
                            - { code: 'ch_reduced',  name: 'CH MWST 2.6%', zone: 'CH', category: 'reduced',  amount: 0.026, included_in_price: true, calculator: 'default' }

                taxon:
                    options:
                        custom:
                            - code: 'category'
                              name: 'Kategorien'
                              slug: 'kategorien'
                              translations:
                                  de_DE: { name: 'Kategorien', slug: 'kategorien' }
                              children:
                                  - code: 'guitars'
                                    name: 'Gitarren'
                                    slug: 'gitarren'
                                    translations:
                                        de_DE: { name: 'Gitarren', slug: 'gitarren' }
                                  - code: 'amplifiers'
                                    name: 'Verstaerker'
                                    slug: 'verstaerker'
                                    translations:
                                        de_DE: { name: 'Verstärker', slug: 'verstaerker' }
                                  - code: 'drums'
                                    name: 'Schlagzeug'
                                    slug: 'schlagzeug'
                                    translations:
                                        de_DE: { name: 'Schlagzeug', slug: 'schlagzeug' }
                                  - code: 'microphones'
                                    name: 'Mikrofone'
                                    slug: 'mikrofone'
                                    translations:
                                        de_DE: { name: 'Mikrofone', slug: 'mikrofone' }
                                  - code: 'effects'
                                    name: 'Effektgeraete'
                                    slug: 'effektgeraete'
                                    translations:
                                        de_DE: { name: 'Effektgeräte', slug: 'effektgeraete' }

                channel:
                    options:
                        custom:
                            germany:
                                code: 'germany'
                                name: 'Deutschland'
                                color: '#FFC107'
                                enabled: true
                                hostname: 'localhost'
                                locales: ['de_DE']
                                currencies: ['EUR']
                                default_tax_zone: 'DE'
                                tax_calculation_strategy: 'order_items_based'
                                contact_email: 'shop@demo.de'
                                menu_taxon: 'category'

                            austria:
                                code: 'austria'
                                name: 'Österreich'
                                color: '#E91E63'
                                enabled: true
                                locales: ['de_AT', 'de_DE']
                                currencies: ['EUR']
                                default_tax_zone: 'AT'
                                tax_calculation_strategy: 'order_items_based'
                                contact_email: 'shop@demo.at'
                                menu_taxon: 'category'

                            switzerland:
                                code: 'switzerland'
                                name: 'Schweiz'
                                color: '#F44336'
                                enabled: true
                                locales: ['de_CH', 'de_DE']
                                currencies: ['CHF', 'EUR']
                                default_tax_zone: 'CH'
                                tax_calculation_strategy: 'order_items_based'
                                contact_email: 'shop@demo.ch'
                                menu_taxon: 'category'

                admin_user:
                    options:
                        custom:
                            - email: 'admin@demo.de'
                              username: 'admin'
                              password: 'admin'
                              enabled: true
                              locale_code: 'de_DE'
                              first_name: 'Demo'
                              last_name: 'Admin'
